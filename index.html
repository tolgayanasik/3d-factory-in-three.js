<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS Plant 01 · Factory Digital Twin</title>
    <meta name="description" content="Interactive three.js digital twin of an automated factory with a live Excel-driven MES link." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316222f'/%3E%3Cpath d='M6 24V13l6 4v-4l6 4v-4l8 5v6z' fill='%2333e1ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>

      <header id="topbar">
        <div class="brand">
          <div class="logo"><svg viewBox="0 0 32 32"><path d="M4 26V12l7 4.5V12l7 4.5V12l10 6v8z" fill="currentColor"/></svg></div>
          <div>
            <div class="brand-name" id="plant-name">NEXUS Plant 01</div>
            <div class="brand-sub">Factory Digital Twin · MES linked</div>
          </div>
        </div>
        <div id="kpis" class="kpis"></div>
        <div class="top-right">
          <div id="link-status" class="link-status" title="Excel data link"></div>
          <div id="clock" class="clock"></div>
        </div>
      </header>

      <aside id="tree-panel" class="panel">
        <div class="panel-head">
          <div class="panel-title">Plant equipment</div>
          <div class="seg" id="group-by">
            <button data-v="category" class="on">Category</button><button data-v="zone">Zone</button>
          </div>
        </div>
        <div class="search"><input id="tree-search" type="search" placeholder="Search equipment, ID, model…" autocomplete="off" /></div>
        <div class="tree-mode">
          <span>On select:</span>
          <div class="seg small" id="sel-mode">
            <button data-v="highlight" class="on" title="Outline the item, keep the plant visible">Highlight</button><button data-v="xray" title="Ghost everything else">X-ray</button><button data-v="isolate" title="Show only the selected item">Isolate</button>
          </div>
        </div>
        <div id="tree" class="tree"></div>
        <div class="tree-foot" id="tree-foot"></div>
      </aside>
      <button id="tree-toggle" class="edge-toggle left" title="Toggle equipment tree">❮</button>

      <aside id="info-panel" class="panel hidden"></aside>

      <div id="toolbar" class="toolbar"></div>
      <div id="minimap" class="minimap"><canvas></canvas><div class="mm-title">Plant map</div></div>
      <div id="alarms" class="alarms collapsed"></div>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="tour-caption" class="tour-caption hidden"></div>
      <div id="toasts" class="toasts"></div>
      <div id="product-panel" class="modal hidden"></div>
      <div id="help" class="modal hidden"></div>
      <div id="walk-hint" class="walk-hint hidden"></div>
      <div id="drop-zone" class="drop-zone hidden"><div>Drop an <b>.xlsx</b> workbook to load its data into the twin</div></div>
      <div id="loader" class="loader">
        <div class="loader-card">
          <div class="logo big"><svg viewBox="0 0 32 32"><path d="M4 26V12l7 4.5V12l7 4.5V12l10 6v8z" fill="currentColor"/></svg></div>
          <div class="loader-title">NEXUS Plant 01</div>
          <div class="loader-sub" id="loader-text">Building the digital twin…</div>
          <div class="loader-bar"><div id="loader-fill"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
